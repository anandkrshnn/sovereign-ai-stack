name: Sovereign CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: pip install ruff mypy black isort
      - name: Run Black & Isort Check
        run: |
          black --check sovereign_ai tests
          isort --check-only sovereign_ai tests
      - name: Run Ruff
        run: ruff check sovereign_ai tests
      - name: Run Mypy (Type Checking)
        run: mypy sovereign_ai --ignore-missing-imports

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[verify,bridge,agent,dashboard,dev]
          pip install pytest-cov pytest-benchmark hypothesis
      - name: Run Pytest with Coverage
        run: pytest tests/ -v --cov=sovereign_ai --cov-report=xml -m "not requires_model and not slow"
      - name: Run Fuzzing / Property-Based Tests (Hypothesis)
        run: pytest tests/verify/test_audit_chain.py tests/verify/test_evaluator_robustness.py -v --hypothesis-show-statistics
      - name: Run Performance Benchmark
        run: pytest tests/benchmark_performance.py --benchmark-only --benchmark-fail-unoptimized

  tpm-smoke-test:
    name: Crypto Smoke Tests (TPM Simulator)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start TPM Simulator & Stack
        run: |
          docker compose up --build -d
          sleep 15 # Wait for SWTPM to bind and init
      - name: E2E Round-Trip Attestation & Quote Validation
        run: |
          python scripts/verify_attestation.py
      - name: Teardown
        if: always()
        run: docker compose down
