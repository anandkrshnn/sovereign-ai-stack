name: Sovereign CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: pip install ruff mypy black isort
      - name: Run Black & Isort Check
        run: |
          black --check sovereign_ai tests
          isort --check-only sovereign_ai tests
      - name: Run Ruff
        run: ruff check sovereign_ai tests --ignore E722,E741,E402,F841,F401,E701
      - name: Run Mypy (Type Checking)
        run: mypy sovereign_ai --ignore-missing-imports

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[verify,bridge,agent,dev]
          pip install pytest-cov pytest-benchmark hypothesis
      - name: Run Pytest with Coverage
        run: pytest tests/ -v --cov=sovereign_ai --cov-report=xml -m "not requires_model and not slow"
      - name: Run Fuzzing / Property-Based Tests (Hypothesis)
        run: pytest tests/verify/test_audit_chain.py tests/verify/test_evaluator_robustness.py -v --hypothesis-show-statistics
      - name: Run Performance Benchmark
        run: pytest tests/ -m "not requires_model and not slow" --benchmark-disable
