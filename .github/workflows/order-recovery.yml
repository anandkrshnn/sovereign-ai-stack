name: Order recovery contracts

on:
  pull_request:
    paths:
      - ".github/workflows/order-recovery.yml"
      - "pyproject.toml"
      - "sovereign_ai/**"
      - "evidence_envelope.py"
      - "tests/conftest.py"
      - "tests/recovery/**"
      - "tests/security/**"
      - "tests/orchestration/test_runner.py"
      - "tests/workflows/test_tamilnadu_cli.py"
      - "tests/workflows/test_tamilnadu_seva.py"
  push:
    branches:
      - main
      - fix/order-durable-journal-pr6
      - "ci/order-recovery-*"
    paths:
      - ".github/workflows/order-recovery.yml"
      - "pyproject.toml"
      - "sovereign_ai/**"
      - "evidence_envelope.py"
      - "tests/conftest.py"
      - "tests/recovery/**"
      - "tests/security/**"
      - "tests/orchestration/test_runner.py"
      - "tests/workflows/test_tamilnadu_cli.py"
      - "tests/workflows/test_tamilnadu_seva.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Local recovery and trust regressions (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/order-recovery.yml
      - name: Install CPU Torch and declared test prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
          python -m pip install -e '.[verify,bridge,agent,dev]'
          python -m pip check
      - name: Record dependency and runtime versions
        run: |
          mkdir -p recovery-artifacts
          python -m pip freeze > recovery-artifacts/dependencies.txt
          python - <<'PY' > recovery-artifacts/runtime.txt
          import platform
          import sqlite3
          import sys
          import pytest
          import torch
          import transformers
          print("platform:", platform.platform())
          print("python:", sys.version)
          print("sqlite:", sqlite3.sqlite_version)
          print("pytest:", pytest.__version__)
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          PY
      - name: Run bounded recovery and unchanged regression suite
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python -m pytest \
            tests/recovery tests/security tests/orchestration/test_runner.py \
            tests/workflows/test_tamilnadu_cli.py tests/workflows/test_tamilnadu_seva.py \
            -q -s --durations=10 --timeout=120 \
            --junitxml=recovery-artifacts/junit.xml
      - name: Preserve results and crash-fixture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: order-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-artifacts/
            /tmp/pytest-of-*/
          if-no-files-found: warn
          retention-days: 7
